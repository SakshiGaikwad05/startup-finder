# Render Blueprint: one Node web service running the whole Next.js app (UI + API).
# Database: a free Neon PostgreSQL (or any Postgres) — set DATABASE_URL in the dashboard.
services:
  - type: web
    name: startup-finder
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste your Neon connection string (…?sslmode=require)
      - key: CRON_SECRET
        generateValue: true # lets a daily scheduler start discovery: POST /api/discover with header x-cron-secret
      - key: APP_PASSWORD
        sync: false # leave EMPTY for a public site; set it only to lock the whole site behind a login
      - key: SEARCH_API_KEY
        sync: false # optional (Brave Search API)
